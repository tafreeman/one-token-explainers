ration/05-streams.mp3","dur":10.8,"stop":4,"cues":[{"t":0.0,"s":"Chapter two: pretraining."},{"t":1.3,"s":"Batches of sequences flow up through every layer at once, and a causal mask makes sure no position can peek at the future."}]},{"id":"06-loss","title":"Score the guess, send gradients down","src":"../shared/journey-narration/06-loss.mp3","dur":13.2,"stop":5,"cues":[{"t":0.0,"s":"After \"the cat\", the model spreads probability over the whole vocabulary."},{"t":5.36,"s":"The loss measures how surprised it was by \"sat\"."},{"t":9.11,"s":"Gradients flow back down, and every weight takes a small step."}]},{"id":"07-racks","title":"Sharded across racks, trained in FP8","src":"../shared/journey-narration/07-racks.mp3","dur":14.0,"stop":6,"cues":[{"t":0.0,"s":"The one point six trillion parameter model is split across racks of accelerators, using several kinds of parallelism at once."},{"t":8.27,"s":"It trains in eight-bit precision, and the released model stores its experts in four bits."}]},{"id":"08-context","title":"Then, a million-token memory","src":"../shared/journey-narration/08-context.mp3","dur":13.12,"stop":7,"cues":[{"t":0.0,"s":"Then the memory stretches."},{"t":2.47,"s":"Pretraining lengthens the context in stages, from four thousand tokens to sixteen thousand, then sixty-four thousand, and finally one million."}]},{"id":"09-specialists","title":"First, specialist SFT and RL","src":"../shared/journey-narration/09-specialists.mp3","dur":12.88,"stop":8,"cues":[{"t":0.0,"s":"Chapter three: post-training."},{"t":2.83,"s":"First, separate specialists for math, code, agents and instructions are trained on worked examples, and then with reinforcement learning."}]},{"id":"10-attempts","title":"Draw a group of attempts","src":"../shared/journey-narration/10-attempts.mp3","dur":9.84,"stop":9,"cues":[{"t":0.0,"s":"For a prompt with a checkable answer, the policy, which is the same tower, samples a group of attempts."},{"t":6.38,"s":"The group of eight in the drawing is illustrative."}]},{"id":"11-grade","title":"Grade against the group","src":"../shared/journey-narration/11-grade.mp3","dur":10.88,"stop":10,"cues":[{"t":0.0,"s":"Verifiers grade code and math, and rubrics grade open-ended answers."},{"t":4.64,"s":"Each score is compared with the group's average, so no separate value model is needed."}]},{"id":"12-distill","title":"Distill specialists into one model","src":"../shared/journey-narration/12-distill.mp3","dur":10.96,"stop":11,"cues":[{"t":0.0,"s":"Winning attempts are reinforced, with a penalty that keeps each specialist close to where it started."},{"t":6.6,"s":"Then distillation merges all the specialists into one model."}]},{"id":"13-embed","title":"An ID becomes a vector","src":"../shared/journey-narration/13-embed.mp3","dur":14.16,"stop":12,"cues":[{"t":0.0,"s":"Chapter four: inside the model."},{"t":2.3,"s":"The token ID picks one row of the embedding table, a lookup, not a calculation."},{"t":8.3,"s":"Out comes a vector of seven thousand, one hundred and sixty-eight numbers."}]},{"id":"14-attention","title":"Normalize, then look back","src":"../shared/journey-narration/14-attention.mp3","dur":9.68,"stop":13,"cues":[{"t":0.0,"s":"A normalized copy of the vector goes into attention."},{"t":3.56,"s":"\"Sat\" can score every earlier token, while a causal mask hides the ones that come later."}]},{"id":"15-compressed","title":"Hybrid compressed attention","src":"../shared/journey-narration/15-compressed.mp3","dur":12.32,"stop":14,"cues":[{"t":0.0,"s":"To reach a million tokens, attention compresses its memory."},{"t":4.48,"s":"Some layers read a sparse selection of compressed blocks plus a recent window."},{"t":9.61,"s":"Others read heavily compressed summaries."}]},{"id":"16-mhc","title":"Merge via hyper-connections","src":"../shared/journey-narration/16-mhc.mp3","dur":11.36,"stop":15,"cues":[{"t":0.0,"s":"Attention's output is added back to the residual stream, which here runs as four parallel lanes, mixed by le const STOPS=[{"i":0,"ch":0,"step":0,"title":"Sources from everywhere","body":"<p>Web pages, code, books, math, and synthetic reasoning traces are gathered into a single stream of raw text.</p><p class=\"fact\"><span>Pretraining corpus: <span class=\"num\">33T</span> tokens</span><cite>DeepSeek-V4 paper</cite></p>","ids":["TR-1"],"skin":"light","css":"skin-light","realm":"TRAINING","p":0.155},{"i":1,"ch":0,"step":1,"title":"Duplicates out, quality in","body":"<p>Copies are hashed and removed so nothing is learned twice. Filters drop low-quality text and personal data, and the mix is rebalanced so no source dominates.</p><code class=\"eq\">clean_data = balance_mix( filter_pii_and_quality( dedupe_hash(raw_sources) ) )</code>","ids":["TR-1"],"skin":"light","css":"skin-light","realm":"TRAINING","p":0.405},{"i":2,"ch":0,"step":2,"title":"Byte-pair encoding cuts the sentence","body":"<p>The tokenizer splits text into pieces from a fixed vocabulary. Common words become one token, and in byte-level vocabularies like this one the leading space usually travels with the word, so our token is “&nbsp;sat”.</p>","ids":["TR-2"],"skin":"light","css":"skin-light","realm":"TRAINING","p":0.655},{"i":3,"ch":0,"step":3,"title":"Every token becomes an ID","body":"<p>Rare words split into several pieces, each an integer ID. Images take a different road: a vision encoder turns patches into vectors, not IDs.</p><code class=\"eq\">token_ids = bpe_encode(\"Architecting\")   // -> [4182, 287] (illustrative IDs)</code><p class=\"fact\"><span>Vocabulary: <span class=\"num\">129,280</span> tokens</span><cite>DeepSeek-V4-Pro config</cite></p>","ids":["TR-2"],"skin":"light","css":"skin-light","realm":"TRAINING","p":0.905},{"i":4,"ch":1,"step":0,"title":"Streams rise through the tower","body":"<p>Batches of token sequences flow up through every layer of the model. In training each sequence is processed in parallel, with a mask so no position can peek at the future.</p>","ids":["TR-3"],"skin":"keynote","css":"skin-key","realm":"TRAINING","p":0.155},{"i":5,"ch":1,"step":1,"title":"Score the guess, send gradients down","body":"<p>After “The cat”, the model spreads probability over the vocabulary. The loss is the negative log of the probability it gave “&nbsp;sat”. Gradients travel back down the same layers and Muon, with AdamW for embeddings, the head and norms, updates the weights.</p><code class=\"eq\">loss = cross_entropy(logits, next_tokens) + mtp_weight * mtp_loss</code><p class=\"fact\"><span class=\"ill\">Bars and loss curve are illustrative.</span></p>","ids":["TR-3","MD-4"],"skin":"keynote","css":"skin-key","realm":"ALL","p":0.405},{"i":6,"ch":1,"step":2,"title":"Sharded across racks, trained in FP8","body":"<p>A model this size is sharded across racks of accelerators using several kinds of parallelism at once, including expert parallelism. DeepSeek-V4 trains in FP8 mixed precision; quantization-aware training later stores the routed experts in FP4 for the released model.</p><p class=\"fact\"><span>FP8 training · FP4 experts via QAT · <span class=\"num\">Muon</span> + AdamW</span><cite>DeepSeek-V4 paper</cite></p>","ids":["TR-7"],"skin":"keynote","css":"skin-key","realm":"TRAINING","p":0.655},{"i":7,"ch":1,"step":3,"title":"Then, a million-token memory","body":"<p>Pretraining stretches the context window in stages, from 4K to 16K to 64K and finally one million tokens, switching on sparse CSA/HCA attention from 64K.</p><p class=\"fact\"><span>Context: <span class=\"num\">4K → 16K → 64K → 1M</span> tokens</span><cite>DeepSeek-V4 paper</cite></p>","ids":["TR-4"],"skin":"keynote","css":"skin-key","realm":"TRAINING","p":0.905},{"i":8,"ch":2,"step":0,"title":"First, specialist SFT and RL","body":"<p>DeepSeek-V4 uses a two-stage post-training pipeline. First, domain specialists (math, code, agentic, instruction) are trained independently via SFT followed by RL with GRPO.</p><p class=\"fact\"><span>Stage 1: Domain specialists (SFT + GRPO) → Stage 2: On-Policy Distillation</span><cite>DeepSeek-V4 paper</cite></p>","ids":["TR-5"],"skin":"blueprint","css":"skin-bp","realm":"TRAINING","p":0.155},{"i":9,"ch":2,"step":1,"title":"Draw a group of attempts","body":"<p>For one prompt with a checkable answer, the policy—the same tower—samples a group of candidate reasoning traces. The group of eight here is illustrative.</p>","ids":["TR-5"],"pose":{"subpose":"grpo"},"skin":"blueprint","css":"skin-bp","realm":"TRAINING","p":0.405},{"i":10,"ch":2,"step":2,"title":"Grade against the group","body":"<p>Rule verifiers score code and math attempts, while rubric-guided self-judging grades open-ended tasks. Each score is compared with the group’s mean—no separate value model required.</p><code class=\"eq\">advantage_i = (score_i - mean(scores)) / std(scores)</code>","ids":["TR-5"],"pose":{"subpose":"verifier"},"skin":"blueprint","css":"skin-bp","realm":"TRAINING","p":0.655},{"i":11,"ch":2,"step":3,"title":"Distill specialists into one model","body":"<p>Winning attempts reinforce each specialist with a KL anchor to the reference model. Then On-Policy Distillation (OPD) merges all domain specialists into one unified model before the release gate.</p><code class=\"eq\">update(policy_weights, advantage, kl_penalty);  student = on_policy_distill(specialists)</code>","ids":["TR-5"],"pose":{"subpose":"opd"},"skin":"blueprint","css":"skin-bp","realm":"TRAINING","p":0.905},{"i":12,"ch":3,"step":0,"title":"An ID becomes a vector","body":"<p>At the base of the tower, the token ID indexes one row of the embedding table: a lookup, not a calculation. Out comes a vector of 7,168 numbers that enters the 4-stream mHC residual bus.</p><code class=\"eq\">vector = EMBEDDING_TABLE[token_id]   // O(1) array lookup -> float[7168]</code><p class=\"fact\"><span>Hidden size <span class=\"num\">7,168</span> · <span class=\"num\">4</span>-stream mHC residual</span><cite>DeepSeek-V4-Pro config</cite></p>","ids":["MD-1"],"skin":"blueprint","css":"skin-bp","realm":"MODEL","p":0.07},{"i":13,"ch":3,"step":1,"title":"Normalize, then look back","body":"<p>RMSNorm rescales a copy of the vector (and Q/KV before core attention). Attention lets “&nbsp;sat” score earlier tokens while a causal mask hides later ones, with learnable attention sinks so heads can abstain.</p><code class=\"eq\">scores = causal_mask( (Q_h @ K_h.T) / sqrt(d) );  out_h = softmax_with_sinks(scores) @ V_h</code>","ids":["MD-2a","MD-2d"],"skin":"blueprint","css":"skin-bp","realm":"MODEL","p":0.2},{"i":14,"ch":3,"step":2,"title":"Hybrid CSA + HCA compression","body":"<p>DeepSeek-V4-Pro interleaves Compressed Sparse Attention (CSA: 4× KV compression + Lightning Indexer top-1,024 + 128-tok window) with Heavily Compressed Attention (HCA: 128× dense summaries) and 64-dim decoupled RoPE. Switch to Inference to watch the KV cache fill.</p><p class=\"fact\"><span>At 1M ctx: <span class=\"num\">27%</span> FLOPs &amp; <span class=\"num\">10%</span> KV cache vs V3.2</span><cite>DeepSeek-V4 paper</cite></p>","ids":["MD-2b","MD-2c"],"skin":"blueprint","css":"skin-bp","realm":"MODEL","p":0.29},{"i":15,"ch":3,"step":3,"title":"Merge via mHC hyper-connections","body":"<p>Attention’s output is projected back to 7,168 and mixed across the 4-stream Manifold-Constrained Hyper-Connections (mHC) residual bus, keeping deep signal propagation stable without over-amplifying.</p><code class=\"eq\">H_stream = mHC_mix(H_stream, linear_project(concat(heads)))   // 4-stream residual</code>","ids":["MD-2e","MD-2f"],"skin":"blueprint","css":"skin-bp","realm":"MODEL","p":0.42},{"i":16,"ch":3,"step":4,"title":"The router picks 6 of 384","body":"<p>A router scores 384 routed FP4 experts via sqrt(softplus) and keeps the top 6, while 1 shared expert always runs. That is why only 49B of the 1.6T parameters work on each token.</p><code class=\"eq\">s = sqrt(softplus(u @ W_router));  top6 = top_k(s + load_bias, k=6);  out = shared_ffn(u) + sum(g_j * ffn_j(u))</code><p class=\"fact\"><span><span class=\"num\">6</span> of <span class=\"num\">384</span> routed experts (+1 shared) · <span class=\"num\">49B</span> active</span><cite>DeepSeek-V4-Pro config</cite></p>","ids":["MD-2g","MD-2h"],"skin":"blueprint","css":"skin-bp","realm":"MODEL","p":0.54},{"i":17,"ch":3,"step":5,"title":"Sixty-one distinct layers","body":"<p>The block repeats 61 times up the tower, each with its own weights. The first 3 use Hash-routed MoE (replacing V3’s dense FFNs), and the rest use learned-router MoE; layers alternate HCA and CSA attention.</p><p class=\"fact\"><span><span class=\"num\">61</span> layers · first <span class=\"num\">3</span> Hash-MoE · HCA/CSA interleaved</span><cite>DeepSeek-V4-Pro config</cite></p>","ids":["MD-2i"],"skin":"blueprint","css":"skin-bp","realm":"MODEL","p":0.62},{"i":18,"ch":3,"step":6,"title":"Score the whole vocabulary","body":"<p>At the top, a final RMSNorm and the LM head turn the vector into one score per vocabulary token (plus an MTP head predicting one token further). What happens next depends on the mode.</p><code class=\"eq\">logits[0..129279] = final_vec @ LM_HEAD.T   // raw unnormalized scores</code><p class=\"fact\"><span><span class=\"num\">7,168 → 129,280</span> logits (+1 MTP layer)</span><cite>DeepSeek-V4-Pro config</cite></p>","ids":["MD-3","MD-4"],"skin":"blueprint","css":"skin-bp","realm":"MODEL","p":0.72},{"i":19,"ch":3,"step":7,"title":"Training: loss up top, gradients down","body":"<p>The top output is compared with the real next token, “&nbsp;on”. The loss flows back down the tower as gradients, and Muon, with AdamW for embeddings, the head and norms, updates the weights. There is no KV cache: the whole sequence runs at once.</p><code class=\"eq\">loss = cross_entropy(logits, next_token);  weights = muon_step(weights, grad(loss))</code>","ids":["MD-4"],"skin":"blueprint","css":"skin-bp","realm":"MODEL","p":0.85},{"i":20,"ch":3,"step":8,"title":"Inference: the same tower, frozen","body":"<p>Serving uses the identical tower with frozen FP4+FP8 weights. The pass only goes up. Each CSA/HCA layer writes its compressed latent into the KV cache beside it, and the top output goes to a sampler.</p><p class=\"fact\"><span class=\"ill\">Same tower as the training stop before it; only the flows change.</span></p>","ids":["MD-2d"],"skin":"blueprint","css":"skin-bp","realm":"MODEL","p":0.97},{"i":21,"ch":4,"step":0,"title":"Through the gate","body":"<p>The API checks your key, rate limits, and reasoning effort setting (Non-think, Think High, Think Max), screens for abuse, and routes you to a cache-warm replica that encodes messages and tools.</p><code class=\"eq\">POST /v1/messages { model, messages, tools, reasoning_effort: \"high\", stream: true }</code><p class=\"fact\"><span>Stateless APIs re-send history each turn; prefix cache avoids re-prefill</span><cite>2026 frontier APIs</cite></p>","ids":["IN-1","IN-2","IN-3","IN-4"],"skin":"light","css":"skin-light","realm":"INFERENCE","p":0.124},{"i":22,"ch":4,"step":1,"title":"Disaggregated & continuously batched","body":"<p>Modern engines separate Prefill and Decode onto dedicated GPU pools (PD disaggregation), continuously batching requests each iteration and transferring paged KV blocks over NVLink/RDMA.</p><code class=\"eq\">gpu_batch = active_decode_users + next_prefill_chunk   // PD-disaggregated pools</code><p class=\"fact\"><span>Continuous batching + Prefill-Decode disaggregation</span><cite>Orca 2022 · llm-d 2025</cite></p>","ids":["IN-5","IN-12"],"skin":"light","css":"skin-light","realm":"INFERENCE","p":0.324},{"i":23,"ch":4,"step":2,"title":"Prefill: read it all at once","body":"<p>The model node opens onto the same tower in inference mode. Every prompt token goes up in one parallel pass on a prefill pool. That is compute-bound, fills the compressed CSA/HCA KV cache, and sets TTFT.</p><p class=\"fact\"><span>GB200 dense FP4: <span class=\"num\">10,000</span> TFLOPS per GPU (<span class=\"num\">5,000</span> FP8; <span class=\"num\">720</span> PFLOPS NVL72 rack; prefill is compute-bound)</span><cite>NVIDIA GB200 NVL72</cite></p>","ids":["IN-6"],"skin":"light","css":"skin-light","realm":"INFERENCE","p":0.524},{"i":24,"ch":4,"step":3,"title":"Decode: one token per tick","body":"<p>Each new token (first hidden &lt;think&gt; tokens, then the visible reply) streams frozen FP4+FP8 weights and the compressed KV cache from HBM3e—memory-bound—often accelerated by MTP/EAGLE speculative drafting.</p><p class=\"fact\"><span>GB200 HBM3e: <span class=\"num\">8.0</span> TB/s per GPU (<span class=\"num\">576</span> TB/s NVL72 rack; decode is memory-bound)</span><cite>NVIDIA GB200 NVL72</cite></p>","ids":["IN-7"],"skin":"light","css":"skin-light","realm":"INFERENCE","p":0.724},{"i":25,"ch":4,"step":4,"title":"Sample, check, stream","body":"<p>The sampler picks the next token (with grammar masks for JSON/tool schemas). Text is detokenized into a buffer, output guardrails check the chunk, and only then is it flushed as a server-sent event.</p><code class=\"eq\">verdict = output_check(buffer);  if (verdict.ok) sse_stream.flush(buffer); else cut_stream();</code><p class=\"fact\"><span>Model card: temperature <span class=\"num\">1.0</span>, top_p <span class=\"num\">1.0</span> for local runs</span><cite>DeepSeek-V4-Pro card</cite></p>","ids":["IN-8","IN-9","IN-10"],"skin":"light","css":"skin-light","realm":"INFERENCE","p":0.924},{"i":26,"ch":5,"step":0,"title":"The model stops with a tool call","body":"<p>Instead of more text, generation ends with a structured tool call (native or MCP server schema) and arguments, and the stop reason signals control back to the caller.</p><code class=\"eq\">resp = POST(messages)   // stop_reason == \"tool_use\"</code><p class=\"fact\"><span>Client-run tools stop generation; hosted tools can execute server-side</span><cite>2026 frontier APIs</cite></p>","ids":["IN-8","IN-11"],"skin":"light","css":"skin-light","realm":"INFERENCE","p":0.155},{"i":27,"ch":5,"step":1,"title":"Your app (or MCP server) runs it","body":"<p>For client tools, your app or an MCP server executes the call and keeps the result (provider-hosted sandboxes can run built-in code/web tools directly). Always treat tool outputs as untrusted input.</p><p class=\"fact\"><span>Prompt injection mostly arrives via tool results and documents, not at the gateway</span><cite>illustrative</cite></p>","ids":["IN-11"],"skin":"light","css":"skin-light","realm":"INFERENCE","p":0.405},{"i":28,"ch":5,"step":2,"title":"A brand-new request","body":"<p>Because chat APIs remain stateless by default, your app sends the conversation plus the tool call and result (even across 1M-token agent sessions).</p><code class=\"eq\">resp2 = POST(messages + [tool_call, result])</code>","ids":["IN-11","IN-6"],"skin":"light","css":"skin-light","realm":"INFERENCE","p":0.655},{"i":29,"ch":5,"step":3,"title":"Prefix cache: prefill only what’s new","body":"<p>The server recognises the unchanged prefix, “&nbsp;sat” included, and reuses its cached CSA/HCA KV blocks. Only the new tool-result tokens are prefilled, then decoding continues until the final reply.</p><code class=\"eq\">// server: prefix-cache hit, prefill only the new tokens</code>","ids":["IN-6","IN-12"],"skin":"light","css":"skin-light","realm":"INFERENCE","p":0.905}];

/* ---------- narration engine (shared by tour and story) ---------- */
function makeNarrator(o){
  const N={clips:null,byStop:new Map(),intro:null,outro:null,cur:null,audio:null,on:false,paused:false,internal:false};
  const btn=o.btn,cap=o.cap;
  async function load(){
    if(N.clips)return N.clips;let d=null;
    if(location.protocol!=='file:'){try{const r=await fetch('../shared/journey-narration/manifest.json',{cache:'no-cache'});if(r.ok)d=await r.json()}catch(_){d=null}}
    if(!d){const el=document.getElementById('narration-manifest');if(el){try{d=JSON.parse(el.textContent)}catch(_){d=null}}}
    if(!d||!Array.isArray(d.clips)||!d.clips.length)return null;
    N.clips=d.clips;d.clips.forEach(c=>{if(c.stop==null){if(!N.intro)N.intro=c;else N.outro=c}else N.byStop.set(c.stop,c)});
    const s=Math.round(d.totalDuration||0),m=Math.floor(s/60),r=s%60;
    btn.querySelector('.narr-dur').textContent=m+':'+String(r).padStart(2,'0');
    btn.setAttribute('aria-label',o.label+' with sound, '+m+' min '+r+' s');btn.hidden=false;return N.clips;
  }
  function setBtn(){btn.setAttribute('aria-pressed',N.on?'true':'false');btn.querySelector('.narr-lbl').textContent=N.on?'Pause':N.paused?'Resume':o.label}
  function caption(c,t){if(!c||!c.cues||!c.cues.length){cap.hidden=true;return}let s=c.cues[0].s;for(const q of c.cues)if(t>=q.t)s=q.s;if(cap.textContent!==s)cap.textContent=s;cap.hidden=false}
  function drop(){const a=N.audio;if(a){a.onended=null;a.onerror=null;a.ontimeupdate=null;a.pause()}N.audio=null}
  function finish(){N.on=false;N.paused=false;drop();N.cur=null;cap.hidden=true;setBtn();if(o.onFinish)o.onFinish()}
  function pause(){if(!N.on)return;N.on=false;N.paused=true;if(N.audio)N.audio.pause();setBtn()}
  function play(c){
    drop();N.cur=c;if(!c){finish();return}
    const a=new Audio(c.src);a.preload='auto';N.audio=a;
    a.ontimeupdate=()=>caption(c,a.currentTime);a.onended=next;a.onerror=next;caption(c,0);
    const p=a.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==='NotAllowedError')pause();else next()});
    const nx=c===N.intro?N.byStop.get(0):c===N.outro?null:(N.byStop.get(c.stop+1)||N.outro);if(nx){const pre=new Audio();pre.preload='auto';pre.src=nx.src}
  }
  function go(n){N.internal=true;try{o.goStop(n)}finally{N.internal=false}play(N.byStop.get(n))}
  function next(){
    if(!N.on)return;const c=N.cur;
    if(c===N.intro){go(0);return}
    if(!c||c===N.outro){finish();return}
    if(c.stop>=29){if(N.outro){if(o.onOutro)o.onOutro();play(N.outro)}else finish();return}
    go(c.stop+1);
  }
  async function toggle(){
    if(N.on){pause();return}
    if(N.paused&&N.audio){N.on=true;N.paused=false;setBtn();const p=N.audio.play();if(p&&p.catch)p.catch(()=>pause());return}
    if(!await load())return;
    N.on=true;N.paused=false;setBtn();
    const s=o.getStop();if(s==null&&o.onStart)o.onStart();play(s==null?N.intro:N.byStop.get(s));
  }
  btn.addEventListener('click',toggle);load();
  return{followStop(n){if(N.on&&!N.internal){const c=N.byStop.get(n);if(c)play(c)}},interrupt(){if(N.on&&!N.internal)pause()}};
}

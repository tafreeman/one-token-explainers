name: Journey verification

# Pushes to a PR branch already run via pull_request; a second push run doubled the timing noise.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run verify:browser
        env:
          JOURNEY_SCREENSHOTS: artifacts/layouts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-layouts
          path: artifacts/layouts

  warp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install chromium
      - run: npm run verify:warp
        env:
          # WARP runs on the CPU. With the browser pinned to 4 cores (this runner's size), the
          # router drawer's median-of-five p95 measured 97-127 ms after Phase 5 (single trials
          # 75-138 ms) and 307-374 ms on main before it. 150 ms absorbs shared-runner noise and
          # still fails a slide back toward main. 100 ms is the 24-thread budget.
          WARP_P95_BUDGET_MS: '150'

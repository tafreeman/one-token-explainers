name: Journey verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run verify:browser
        env:
          JOURNEY_SCREENSHOTS: artifacts/layouts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-layouts
          path: artifacts/layouts

  warp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install chromium
      - run: npm run verify:warp

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Social card source</title>
<!-- Source for shared/og-one-token.png (1200x630). Re-render with: node tools/render-og-card.cjs -->
<style>
@font-face{font-family:"Roboto Flex";src:url("../one-token/fonts/roboto-flex.woff2") format("woff2");font-weight:100 1000;font-stretch:25% 151%}
@font-face{font-family:"Martian Mono";src:url("../one-token/fonts/martian-mono.woff2") format("woff2");font-weight:100 800}
:root{--paper:#F6F5F2;--plate:#FFFFFF;--inset:#ECEAE3;--ink:#16181B;--muted:#5D6168;--line:#C9C6BD;--acc:#FF4A1C;--acc-ink:#C2310B}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--paper)}
body{font-family:"Roboto Flex",system-ui,sans-serif;color:var(--ink);position:relative}
h1{position:absolute;left:72px;top:84px;width:900px;font-size:74px;line-height:1.02;font-weight:720;font-stretch:92%;letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:normal;color:var(--acc-ink)}
p{position:absolute;left:74px;top:268px;width:820px;font-size:29px;line-height:1.34;color:var(--muted);font-weight:430;text-wrap:balance}
svg{position:absolute;left:0;top:380px}
.lbl{font:600 17px "Martian Mono",monospace;letter-spacing:.06em;fill:#45484E}
.lbl.on{fill:var(--acc-ink)}
</style></head><body>
<h1>Follow <em>one token</em> through a frontier LLM.</h1>
<p>From a page of training text to the reply on your screen: one line of stages, drawn to scale and narrated.</p>
<svg width="1200" height="230" viewBox="0 0 1200 230" aria-hidden="true">
  <defs><linearGradient id="trail" x1="0" x2="1"><stop offset="0" stop-color="#FF4A1C" stop-opacity="0"/><stop offset="1" stop-color="#FF4A1C" stop-opacity=".8"/></linearGradient></defs>
  <line x1="85" y1="96" x2="1115" y2="96" stroke="var(--line)" stroke-width="2"/>
  <rect x="275" y="92" width="360" height="8" rx="4" fill="url(#trail)"/>
  <g id="stations"></g>
  <rect x="625" y="74" width="44" height="44" rx="9" fill="var(--acc)"/>
  <rect x="638" y="87" width="18" height="18" rx="3" fill="var(--paper)" opacity=".9"/>
</svg>
<script>
const g = document.getElementById('stations');
const NS = 'http://www.w3.org/2000/svg';
const chapters = ['DATA', 'PRETRAIN', 'POST-TRAIN', 'MODEL', 'SERVE', 'TOOLS'];
const x0 = 85, x1 = 1115, n = 12; // outer station edges sit on the 72px text margins
for (let i = 0; i < n; i++) {
  const x = x0 + (x1 - x0) * i / (n - 1);
  const passed = x < 650; // stations the token has already passed
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', x - 13); r.setAttribute('y', 83); r.setAttribute('width', 26); r.setAttribute('height', 26); r.setAttribute('rx', 5);
  r.setAttribute('fill', passed ? '#FFFFFF' : '#ECEAE3');
  r.setAttribute('stroke', passed ? '#C2310B' : '#A9A59B'); r.setAttribute('stroke-width', 2);
  g.appendChild(r);
}
chapters.forEach((c, i) => {
  const x = x0 + (x1 - x0) * (2 * i + .5) / (n - 1);
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', x + 1); t.setAttribute('y', 160); t.setAttribute('text-anchor', 'middle');
  t.setAttribute('class', 'lbl' + (i === 3 ? ' on' : ''));
  t.textContent = c;
  g.appendChild(t);
});
</script>
</body></html>
